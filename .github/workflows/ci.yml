# One trust chain: verify source -> test production at both URL layouts -> deploy.
# Pull-request code never receives Pages write permissions or deployment secrets.
name: Verify and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CI: 'true'

jobs:
  source:
    name: Source and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tracked-source publication hygiene
        run: npm run verify:release
      - name: Types, ownership, frame contracts, call map and loader tests
        run: npm run verify
      - name: Documentation links and generated documentation
        run: npm run verify:docs

  browser:
    name: Browser and production (${{ matrix.layout }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - layout: root
            base: /
          - layout: project
            base: /cod2.ts/
    env:
      COD2_BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/tests/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tools/tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build production code only
        run: npm run build:bundle
      - name: Validate emitted paths, imports and publication contents
        run: npm run verify:site -- --base "$COD2_BASE_PATH"
      - name: Accessible and responsive launcher
        run: npm run verify:ui
      - name: Actual production workers, OPFS, IDB and service worker
        run: npm run verify:demand-browser -- --base "$COD2_BASE_PATH" --dist temp/dist
      - name: Retain browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-diagnostics-${{ matrix.layout }}
          path: temp/test-results/
          if-no-files-found: ignore
          retention-days: 7

  verified:
    # Use this single, stable check in the main branch ruleset.
    name: Verified
    if: always()
    needs: [source, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every verification lane
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$BROWSER_RESULT" = success

  pages-build:
    name: Prepare Pages artifact
    needs: verified
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Read the actual project or custom-domain base
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/tests/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tools/tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build and test the exact artifact to be deployed
        env:
          COD2_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run build:bundle
          npm run verify:site -- --base "$COD2_BASE_PATH"
          npm run verify:demand-browser -- --base "$COD2_BASE_PATH" --dist temp/dist
      - name: Upload only public application output
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: temp/dist
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    needs: pages-build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No checkout, npm scripts, user input or payment credentials in this job.
      - name: Publish the tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
